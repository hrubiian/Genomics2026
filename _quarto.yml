project:
  type: website
  output-dir: docs      # <- important for GitHub Pages
  render:
    - "*.qmd"           # index, syllabus, resources
    - "qmd/*.qmd"       # homework / instruction pages
    - "!about.qmd"      # leftover Quarto template page - not published
    - "!HTML/"          # leftover Quarto template page - not published
  resources:
    - .nojekyll         # stops GitHub from running Jekyll over the output
    - qmd/Amino_Acids_Trainer.html   # standalone HTML game, copied as-is

website:
  title: "Structural and Functional Genomics"
  site-url: https://hrubiian.github.io/Genomics2026/
  repo-url: https://github.com/hrubiian/Genomics2026
  navbar:
    logo: iht-logo-100.png
    left:
      - href: index.qmd
        text: Home
      - href: syllabus.qmd
        text: Syllabus
      - href: resources.qmd
        text: Resources
      - href: AI_prompts.qmd
        text: AI Prompts
      - text: Інтерактив
        menu:
          - href: qmd/Genetics_Basics_Interactive.qmd
            text: "0. Основи генетики (почніть звідси)"
          - href: qmd/HW4_Genetic_Variation_1000G.qmd
            text: "1. Типи генетичної мінливості (HW4)"
          - href: qmd/Population_Genomics_Interactive.qmd
            text: "2. Популяційна геноміка"
          - href: qmd/Evolutionary_Genetics_Interactive.qmd
            text: "3. Еволюційна і кількісна генетика"
          - href: qmd/Amino_Acids_Trainer.html
            text: "Амінокислотний тренажер (гра)"
          - text: "---"
          - href: qmd/Bioinformatics_Formats_Interactive.qmd
            text: "Довідник: формати файлів (FASTA, FASTQ, SAM, VCF, BED, GFF)"
      # - href: HomeWork.qmd
      #   text: HomeWork

format:
  html:
    # Light/dark toggle appears in the navbar automatically.
    # The dark variant is a black "neon" theme (neon-dark.scss).
    theme:
      light: cosmo
      dark: [cosmo, neon-dark.scss]
    respect-user-color-scheme: true   # first visit follows the OS light/dark setting
    highlight-style:
      light: github
      dark: dracula
    toc: true
    css: styles.css
