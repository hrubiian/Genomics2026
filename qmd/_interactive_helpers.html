<style>
.lvl{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:600;margin-right:4px;border:1px solid transparent}
.lvl1{background:#e6f4ea;color:#1b6b3a;border-color:#b9dfc6}
.lvl2{background:#e8f0fb;color:#1f5aa6;border-color:#bfd3f0}
.lvl3{background:#f1eafa;color:#5b3a99;border-color:#d6c6ef}
.gl{border-bottom:1.5px dotted #2a78d6;cursor:help;outline:none}
.gl:focus-visible{outline:2px solid #2a78d6;outline-offset:2px;border-radius:2px}
#gl-pop{position:absolute;z-index:2000;max-width:320px;background:#1f2933;color:#fff;font-size:.86rem;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.18);display:none}
#gl-pop b{font-size:.92rem}
#gl-pop .en{color:#b8c4d0;font-size:.8rem;margin-left:4px}
#gl-pop a{color:#9cc8ff}
.ig-progress{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem;color:#52606d;margin:.5rem 0 1rem}
.ig-progress .bar{flex:1 1 180px;height:8px;background:#e3e8ee;border-radius:99px;overflow:hidden;max-width:360px}
.ig-progress .bar span{display:block;height:100%;background:#1f8a4c;border-radius:99px;transition:width .3s}
.ig-done{display:inline-flex;align-items:center;gap:6px;margin:.25rem 0 1.5rem;padding:4px 12px;border:1px solid #cfd8e3;border-radius:999px;background:#fff;color:#52606d;font-size:.85rem;cursor:pointer}
.ig-done[aria-pressed="true"]{background:#e6f4ea;border-color:#9ccfae;color:#1b6b3a}
.ig-done:focus-visible{outline:2px solid #2a78d6;outline-offset:2px}
.route{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:1rem 0 1.5rem}
.route a.card{display:block;text-decoration:none;color:#1f2933;border:1px solid #dde3ea;border-radius:10px;padding:12px 14px;background:#fff;min-width:0}
.route a.card:hover{border-color:#2a78d6}
.route a.card.here{border:2px solid #2a78d6;background:#f4f8fe}
.route .step{font-size:.78rem;color:#7b8794;text-transform:uppercase;letter-spacing:.04em}
.route .nm{font-weight:600;margin:2px 0 6px}
.route ul{margin:0;padding-left:1.1em;font-size:.84rem;color:#52606d}
#glossary .glsearch{max-width:360px;margin-bottom:10px}
#glossary dl{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:6px 16px;margin:0}
#glossary dt{font-weight:600}
#glossary dt .en{display:block;font-weight:400;font-size:.8rem;color:#7b8794}
#glossary dd{margin:0;color:#334155}
#glossary .row:target dt,#glossary .row:target dd{background:#fff6d6}
@media (max-width:560px){#glossary dl{grid-template-columns:1fr}#glossary dd{margin-bottom:8px}}
</style>

function wrapTerms(){
  var root=document.querySelector("main#quarto-document-content")||document.querySelector("main")||document.body;
  var autos=G.filter(function(g){return g[3];});
  var parts;try{parts=autos.map(function(g){return new RegExp("(?<![\\p{L}\\p{N}])(?:"+g[3]+")(?![\\p{L}\\p{N}])","u");});}catch(e){return;}
  var sections=root.querySelectorAll("section.level1");if(!sections.length)sections=[root];
  var skip="pre,code,a,h1,h2,h3,h4,h5,h6,.lab,.math,.gl,.quiz,#glossary,.route,.callout-header,.lvl,script,style,button,input,select,label,canvas,mjx-container";
  sections.forEach(function(sec){var used={};
    var blocks=sec.querySelectorAll("p,li,dd");
    blocks.forEach(function(b){if(b.closest(skip))return;
      var walker=document.createTreeWalker(b,NodeFilter.SHOW_TEXT,{acceptNode:function(n){return n.parentElement&&n.parentElement.closest(skip)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
      var nodes=[];while(walker.nextNode())nodes.push(walker.currentNode);
      nodes.forEach(function(node){var text=node.nodeValue;var best=null;
        for(var i=0;i<autos.length;i++){if(used[autos[i][0]])continue;var m=parts[i].exec(text);if(m&&(best===null||m.index<best.idx||(m.index===best.idx&&m[0].length>best.len)))best={idx:m.index,len:m[0].length,i:i};}
        if(!best)return;used[autos[best.i][0]]=1;
        var before=text.slice(0,best.idx),word=text.slice(best.idx,best.idx+best.len),after=text.slice(best.idx+best.len);
        var span=document.createElement("span");span.className="gl";span.tabIndex=0;span.dataset.gl=autos[best.i][0];span.textContent=word;span.setAttribute("role","button");span.setAttribute("aria-label",word+": пояснення терміну");
        span.addEventListener("mouseenter",function(){show(span);});span.addEventListener("mouseleave",function(){setTimeout(function(){if(!pop.matches(":hover")&&cur===span)hide();},150);});
        span.addEventListener("focus",function(){show(span);});span.addEventListener("blur",function(){setTimeout(function(){if(document.activeElement&&pop.contains(document.activeElement))return;if(cur===span)hide();},150);});
        var frag=document.createDocumentFragment();if(before)frag.appendChild(document.createTextNode(before));frag.appendChild(span);if(after)frag.appendChild(document.createTextNode(after));
        node.parentNode.replaceChild(frag,node);});
    });});
  pop.addEventListener("mouseleave",hide);}
/* progress */
function progress(){var root=document.querySelector("main#quarto-document-content")||document.body;
  var secs=[].slice.call(root.querySelectorAll("section.level1")).filter(function(s){var h=s.querySelector("h1");return h&&/^\s*\d+\./.test(h.textContent);});
  if(!secs.length)return;var key="ig-progress:"+location.pathname.split("/").pop();var st={};try{st=JSON.parse(localStorage.getItem(key)||"{}");}catch(e){st={};}
  var bar=document.createElement("div");bar.className="ig-progress";bar.innerHTML='<span id="ig-ptxt"></span><div class="bar"><span id="ig-pbar"></span></div>';
  secs[0].parentNode.insertBefore(bar,secs[0]);
  function upd(){var n=secs.filter(function(s){return st[s.id];}).length;document.getElementById("ig-ptxt").textContent="Ви розібрали "+n+" з "+secs.length+" розділів";document.getElementById("ig-pbar").style.width=(100*n/secs.length)+"%";}
  secs.forEach(function(s){var b=document.createElement("button");b.type="button";b.className="ig-done";
    function lab(){var on=!!st[s.id];b.setAttribute("aria-pressed",on?"true":"false");b.textContent=on?"✓ Розібрався з цим розділом":"Позначити розділ як розібраний";}
    b.addEventListener("click",function(){st[s.id]=!st[s.id];try{localStorage.setItem(key,JSON.stringify(st));}catch(e){}lab();upd();});lab();s.appendChild(b);});
  upd();}
function init(){try{renderGlossary();}catch(e){}try{wrapTerms();}catch(e){}try{progress();}catch(e){}}
if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
